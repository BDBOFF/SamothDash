name: Aperçu des réglages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reglages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Polices
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL --retry 4 -o app/src/main/assets/fonts/unbounded.ttf "https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          curl -fsSL --retry 4 -o app/src/main/assets/fonts/inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
      - name: Compiler
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_c
          disable-animations: true
          script: bash .github/reglages.sh
      - name: Publier
        if: always()
        run: |
          cd shots
          git init -q -b apercu
          git add -A
          git -c user.name=apercu -c user.email=apercu@localhost commit -qm "Captures"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apercu
