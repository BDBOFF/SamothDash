name: Aperçu sur émulateur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Polices
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL --retry 4 -o app/src/main/assets/fonts/unbounded.ttf "https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          curl -fsSL --retry 4 -o app/src/main/assets/fonts/inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
      - name: Compiler
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Lancer un Home Assistant de test
        timeout-minutes: 12
        run: |
          sudo apt-get install -y -qq ffmpeg libturbojpeg0 > /dev/null
          python -m venv /tmp/ha
          /tmp/ha/bin/pip install -q homeassistant home-assistant-frontend pymicro-vad pyspeex-noise
          C=$(/tmp/ha/bin/python -c "import homeassistant,os;print(os.path.dirname(homeassistant.__file__))")/package_constraints.txt
          /tmp/ha/bin/pip install -q -c "$C" numpy PyTurboJPEG || /tmp/ha/bin/pip install -q numpy
          mkdir -p /tmp/cfg/.storage
          cp .github/e2e/configuration.yaml .github/e2e/tab.yaml /tmp/cfg/
          echo '{"version":4,"minor_version":1,"key":"onboarding","data":{"done":["user","core_config","integration","analytics"]}}' > /tmp/cfg/.storage/onboarding
          /tmp/ha/bin/python -m homeassistant --script auth -c /tmp/cfg add samoth motdepasse
          nohup /tmp/ha/bin/python -m homeassistant -c /tmp/cfg > /tmp/ha.log 2>&1 < /dev/null &
          for i in $(seq 1 100); do curl -fs -o /dev/null http://127.0.0.1:8123/manifest.json && break; sleep 5; done
          sleep 30
          for i in $(seq 1 30); do
            timeout 20 python3 .github/e2e/ha.py states > /tmp/etats.txt || true
            grep -q '^camera.demo_camera ' /tmp/etats.txt && break
            sleep 10
          done
          cat /tmp/etats.txt
          grep -q '^camera.demo_camera ' /tmp/etats.txt
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated
          script: bash .github/preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apercu
          path: shots/
      - name: Publier les captures sur la branche apercu
        if: always()
        run: |
          cp /tmp/ha.log shots/ha.log || true
          cd shots
          git init -q -b apercu
          git add -A
          git -c user.name=apercu -c user.email=apercu@localhost commit -qm "Captures"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apercu
